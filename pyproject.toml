[project]
name = "systematic-trading"
version = "0.1.0"
description = ""
authors = [
    {name = "Jin Liu",email = "liujin04@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy (>=2.4.2,<3.0.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "pathlib (>=1.0.1,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "plotly (>=6.5.2,<7.0.0)",
    "nbformat (>=5.10.4,<6.0.0)"
]

[tool.poetry]
packages = [{include = "systematic_trading", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
